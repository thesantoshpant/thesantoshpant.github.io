<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Redirecting</title>
    <!-- Single-page site: any unknown path goes back to the root, keeping the hash. -->
    <script>
      (function () {
        window.location.replace("/" + window.location.hash);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/">the home page</a>.</p>
  </body>
</html>
