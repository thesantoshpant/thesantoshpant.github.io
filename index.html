<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0A0E14" />

    <!-- Resolve theme before first paint (no flash). Default dark; honor a stored
         choice, else the OS prefers-color-scheme. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored
            ? stored === "dark"
            : !window.matchMedia("(prefers-color-scheme: light)").matches;
          document.documentElement.classList.toggle("dark", dark);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#0A0E14" : "#F7F9FB");
        } catch (e) {}
      })();
    </script>

    <title>Santosh Pant | Geospatial-ML Researcher and Software Engineer</title>
    <meta
